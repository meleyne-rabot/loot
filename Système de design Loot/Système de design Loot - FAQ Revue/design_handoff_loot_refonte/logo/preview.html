<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#EDE9E3;font-family:system-ui,sans-serif;padding:40px;display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px}
  .cap{font:600 12px system-ui;color:#8A879B}
  img.tile{width:150px;height:150px;border-radius:34px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
</style></head>
<body>
  <div class="cell"><img class="tile" src="loot-app-icon.svg"><span class="cap">corail (primaire)</span></div>
  <div class="cell"><img class="tile" src="loot-app-icon-light.svg"><span class="cap">clair</span></div>
  <div class="cell"><img class="tile" src="loot-app-icon-dark.svg"><span class="cap">foncé</span></div>
  <div class="cell"><img src="loot-app-icon.svg" style="width:52px;height:52px;border-radius:12px"><span class="cap">favicon 52px</span></div>
  <div class="cell" style="width:100%"><img src="loot-lockup.svg" style="width:520px;max-width:100%"><span class="cap">lockup horizontal</span></div>
</body></html>
